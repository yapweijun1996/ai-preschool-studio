name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need these exact token scopes; nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Unit tests
        run: npm test

      # Typecheck + Vite build. The app uses a relative base and hash routing,
      # so dist/ works under https://<user>.github.io/<repo>/ without rewrites.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Live contract smoke: the deployed site must serve this commit's build and pass the
  # main journey in a real browser (agents cannot reach *.github.io from their sandbox).
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    # Read-only: the smoke job only checks out and tests; it never writes to Pages.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Live build matches this commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          # page_url may or may not end in "/": normalise to exactly one.
          base="${PAGE_URL%/}/"
          expected="${GITHUB_SHA::7}"
          for i in $(seq 1 12); do
            build=$(curl -fsS "${base}version.json?ts=$(date +%s)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).build)}catch{console.log("")}})') || build=""
            echo "attempt $i: live build=${build:-none} expected=${expected}"
            [ "$build" = "$expected" ] && exit 0
            sleep 10
          done
          echo "::error::Live site does not serve build ${expected}"
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E against the live site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        # Same normalisation, so relative page.goto('./…') resolves under the repo sub-path.
        run: BASE_URL="${PAGE_URL%/}/" npx playwright test e2e/journey.spec.ts e2e/sidebar.spec.ts e2e/profile.spec.ts e2e/navigation.spec.ts e2e/polish.spec.ts e2e/students-data.spec.ts e2e/framework.spec.ts e2e/catalog.spec.ts --reporter=line

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-smoke-results
          path: test-results
          retention-days: 7
